<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="972px" preserveAspectRatio="none" style="width:551px;height:972px;background:#FEFEFE;" version="1.1" viewBox="0 0 551 972" width="551px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><rect fill="#FEFEFE" height="972" style="stroke:none;stroke-width:1;" width="551" x="0" y="0"/><ellipse cx="157.6016" cy="25" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#87CEEB" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0066CC;stroke-width:0.5;" width="239.334" x="37.9346" y="55"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.334" x="47.9346" y="76.1387">1. Buyer calls with purchase request</text><rect fill="#87CEEB" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0066CC;stroke-width:0.5;" width="218.6445" x="48.2793" y="108.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.6445" x="58.2793" y="130.1074">2. Capture buyer details &amp; goods</text><path d="M285.7168,167.3555 L285.7168,175.9219 L265.7168,179.9219 L285.7168,183.9219 L285.7168,192.4883 A0,0 0 0 0 285.7168,192.4883 L530.6304,192.4883 A0,0 0 0 0 530.6304,192.4883 L530.6304,177.3555 L520.6304,167.3555 L285.7168,167.3555 A0,0 0 0 0 285.7168,167.3555" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M520.6304,167.3555 L520.6304,177.3555 L530.6304,177.3555 L520.6304,167.3555" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.9136" x="291.7168" y="184.4224">Very fast green screen application</text><rect fill="#87CEEB" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0066CC;stroke-width:0.5;" width="216.2305" x="49.4863" y="162.9375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.2305" x="59.4863" y="184.0762">3. Check inventory (IBM OS/390)</text><rect fill="#87CEEB" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0066CC;stroke-width:0.5;" width="283.2031" x="16" y="216.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="263.2031" x="26" y="238.0449">4. Provide goods info, prices, delivery dates</text><rect fill="#87CEEB" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0066CC;stroke-width:0.5;" width="254.1758" x="30.5137" y="270.875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.1758" x="40.5137" y="292.0137">5. Buyer confirms order details &amp; signs</text><rect fill="#87CEEB" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0066CC;stroke-width:0.5;" width="173.375" x="70.9141" y="324.8438"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.375" x="80.9141" y="345.9824">6. Create order in system</text><rect fill="#87CEEB" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0066CC;stroke-width:0.5;" width="151.7773" x="81.7129" y="378.8125"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.7773" x="91.7129" y="399.9512">7. Ship order to buyer</text><rect fill="#87CEEB" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0066CC;stroke-width:0.5;" width="162.2656" x="76.4688" y="432.7813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="142.2656" x="86.4688" y="453.9199">8. Ship invoice to buyer</text><rect fill="#87CEEB" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0066CC;stroke-width:0.5;" width="261.6406" x="26.7813" y="486.75"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.6406" x="36.7813" y="507.8887">9. Buyer receives goods &amp; verifies order</text><rect fill="#87CEEB" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0066CC;stroke-width:0.5;" width="156.8047" x="79.1992" y="540.7188"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.8047" x="89.1992" y="561.8574">10. Buyer pays invoice</text><rect fill="#87CEEB" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0066CC;stroke-width:0.5;" width="142.3789" x="86.4121" y="594.6875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.3789" x="96.4121" y="615.8262">11. Record payment</text><path d="M188.6016,638.6563 L188.6016,790.9844 L168.6016,794.9844 L188.6016,798.9844 L188.6016,951.3125 A0,0 0 0 0 188.6016,951.3125 L500.8257,951.3125 A0,0 0 0 0 500.8257,951.3125 L500.8257,648.6563 L490.8257,638.6563 L188.6016,638.6563 A0,0 0 0 0 188.6016,638.6563" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M490.8257,638.6563 L490.8257,648.6563 L500.8257,648.6563 L490.8257,638.6563" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="267.9473" x="194.6016" y="655.7231">Main Success Scenario (Happy Path)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="194.6016" y="670.856">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.9619" x="194.6016" y="685.9888">This is the ideal flow with no exceptions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.2251" x="194.6016" y="701.1216">or alternative paths. All steps execute</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.2241" x="194.6016" y="716.2544">in sequence from trigger to goal completion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="194.6016" y="731.3872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="106.2026" x="194.6016" y="746.52">Preconditions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.2212" x="194.6016" y="761.6528">- Customer record exists</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.186" x="194.6016" y="776.7856">- Customer address known</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.585" x="194.6016" y="791.9185">- Valid contact information on file</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="194.6016" y="807.0513">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="170.3584" x="194.6016" y="822.1841">Success End Condition:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.4443" x="194.6016" y="837.3169">- Buyer has goods</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.4595" x="194.6016" y="852.4497">- Company has money</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.5317" x="194.6016" y="867.5825">- Order recorded in system</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.3833" x="194.6016" y="882.7153">- Invoice sent to buyer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="194.6016" y="897.8481">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="151.9629" x="194.6016" y="912.981">Performance Target:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.8813" x="194.6016" y="928.1138">- 5 minutes for order</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.3281" x="194.6016" y="943.2466">- 45 days until paid</text><ellipse cx="157.6016" cy="794.9844" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="157.6016" cy="794.9844" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="157.6016" x2="157.6016" y1="35" y2="55"/><polygon fill="#181818" points="153.6016,45,157.6016,55,161.6016,45,157.6016,49" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="157.6016" x2="157.6016" y1="88.9688" y2="108.9688"/><polygon fill="#181818" points="153.6016,98.9688,157.6016,108.9688,161.6016,98.9688,157.6016,102.9688" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="157.6016" x2="157.6016" y1="142.9375" y2="162.9375"/><polygon fill="#181818" points="153.6016,152.9375,157.6016,162.9375,161.6016,152.9375,157.6016,156.9375" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="157.6016" x2="157.6016" y1="196.9063" y2="216.9063"/><polygon fill="#181818" points="153.6016,206.9063,157.6016,216.9063,161.6016,206.9063,157.6016,210.9063" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="157.6016" x2="157.6016" y1="250.875" y2="270.875"/><polygon fill="#181818" points="153.6016,260.875,157.6016,270.875,161.6016,260.875,157.6016,264.875" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="157.60