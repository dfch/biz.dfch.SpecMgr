name: Lint and Test

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    env:
      # Opt-in to Node 24 to avoid Node 20 deprecation warnings (effective June 2026).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - name: Checkout
      # uses: actions/checkout@v5
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Install uv
      # uses: astral-sh/setup-uv@v5 v5.2.1
      uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Verify tools 1
      run: |
        uv --version

    - name: Install dependencies
      run: uv sync --frozen --python "${{ matrix.python-version }}" --all-extras

    - name: Verify tools 2
      run: |
        uv run --frozen python --version
        uv run --frozen ruff --version
        uv run --frozen pylint --version
        uv run --frozen vulture --version

    - name: Analyzing the code with pylint and ruff
      run: |
        uv run --frozen ruff format --check
        uv run --frozen ruff check
        uv run --frozen pylint $(git ls-files '*.py') || true

    - name: Check for dead code with vulture
      run: |
        uv run --frozen vulture src/ whitelist.py --min-confidence 60

    - name: Run unit tests with coverage
      run: |
        uv run --frozen pytest -n auto --cov=src --cov-report=

    - name: Make sure `docs/` is correct
      # Python's inspect module (used by annotated-doc for API docs generation) formats
      # exception method signatures differently across Python versions (e.g., 3.12 vs 3.13).
      # This causes docs/ to differ when regenerated on different Python versions. To avoid
      # CI failures due to Python version differences rather than actual code changes, we
      # pin this check to Python 3.13.13 (the project's default dev version in .python-version).
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr docs
        git diff --exit-code -- docs/ || {
          echo "::error::docs/ is out of date -- run 'uv run --frozen --all-extras specmgr docs' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `docs/adr/README.md` is correct
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr adr-toc
        git diff --exit-code -- docs/adr/README.md || {
          echo "::error::docs/adr/README.md is out of date -- run 'uv run --frozen --all-extras specmgr adr-toc' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `docs/MCP.md` is correct
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr mcp-docs
        git diff --exit-code -- docs/MCP.md || {
          echo "::error::docs/MCP.md is out of date -- run 'uv run --frozen --all-extras specmgr mcp-docs' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `docs/*_schema.json` is correct
      # `specmgr schema` without --type regenerates/checks ALL registered doc types
      # (dec, feat, gol, prb, qa, req, rsk, sop, sysrs, tsk, uc, vcr) in a single run, and the command itself
      # exits 1 when the regenerated content differs from what was already on disk
      # (or the file didn't exist yet), so no separate `git diff --exit-code` step
      # is needed here, unlike the `docs/`/`docs/adr/README.md` checks above.
      # One step covers every `docs/<type>_schema.json` -- including `tsk` and
      # `rsk`, which never got their own dedicated step (their docs copies are
      # checked incidentally via this run).
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema || {
          echo "::error::docs/*_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/req/data/req_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_req_schema` MCP tool
      # via importlib.resources (Task 3.8) so it works from a real, non-editable install.
      # Same generator as the step above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type req --output-dir src/biz/dfch/specmgr/req/data || {
          echo "::error::src/biz/dfch/specmgr/req/data/req_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type req --output-dir src/biz/dfch/specmgr/req/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/uc/data/uc_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_uc_schema` MCP tool
      # via importlib.resources so it works from a real, non-editable install.
      # Same generator as the step above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type uc --output-dir src/biz/dfch/specmgr/uc/data || {
          echo "::error::src/biz/dfch/specmgr/uc/data/uc_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type uc --output-dir src/biz/dfch/specmgr/uc/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/tsk/data/tsk_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_tsk_schema` MCP tool
      # via importlib.resources so it works from a real, non-editable install.
      # Same generator as the `docs/*_schema.json` steps above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type tsk --output-dir src/biz/dfch/specmgr/tsk/data || {
          echo "::error::src/biz/dfch/specmgr/tsk/data/tsk_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type tsk --output-dir src/biz/dfch/specmgr/tsk/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/rsk/data/rsk_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_rsk_schema` MCP tool
      # via importlib.resources so it works from a real, non-editable install.
      # Same generator as the `docs/*_schema.json` steps above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type rsk --output-dir src/biz/dfch/specmgr/rsk/data || {
          echo "::error::src/biz/dfch/specmgr/rsk/data/rsk_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type rsk --output-dir src/biz/dfch/specmgr/rsk/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/qa/data/qa_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_qa_schema` MCP tool
      # via importlib.resources so it works from a real, non-editable install.
      # Same generator as the `docs/*_schema.json` steps above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type qa --output-dir src/biz/dfch/specmgr/qa/data || {
          echo "::error::src/biz/dfch/specmgr/qa/data/qa_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type qa --output-dir src/biz/dfch/specmgr/qa/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/prb/data/prb_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_prb_schema` MCP tool
      # via importlib.resources so it works from a real, non-editable install.
      # Same generator as the `docs/*_schema.json` steps above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type prb --output-dir src/biz/dfch/specmgr/prb/data || {
          echo "::error::src/biz/dfch/specmgr/prb/data/prb_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type prb --output-dir src/biz/dfch/specmgr/prb/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/gol/data/gol_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_gol_schema` MCP tool
      # via importlib.resources so it works from a real, non-editable install.
      # Same generator as the `docs/*_schema.json` steps above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type gol --output-dir src/biz/dfch/specmgr/gol/data || {
          echo "::error::src/biz/dfch/specmgr/gol/data/gol_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type gol --output-dir src/biz/dfch/specmgr/gol/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/dec/data/dec_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_dec_schema` MCP tool
      # via importlib.resources so it works from a real, non-editable install.
      # Same generator as the `docs/*_schema.json` steps above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type dec --output-dir src/biz/dfch/specmgr/dec/data || {
          echo "::error::src/biz/dfch/specmgr/dec/data/dec_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type dec --output-dir src/biz/dfch/specmgr/dec/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/sop/data/sop_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_sop_schema` MCP tool
      # via importlib.resources so it works from a real, non-editable install.
      # Same generator as the `docs/*_schema.json` steps above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type sop --output-dir src/biz/dfch/specmgr/sop/data || {
          echo "::error::src/biz/dfch/specmgr/sop/data/sop_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type sop --output-dir src/biz/dfch/specmgr/sop/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/feat/data/feat_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_feat_schema` MCP tool
      # via importlib.resources so it works from a real, non-editable install.
      # Same generator as the `docs/*_schema.json` steps above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type feat --output-dir src/biz/dfch/specmgr/feat/data || {
          echo "::error::src/biz/dfch/specmgr/feat/data/feat_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type feat --output-dir src/biz/dfch/specmgr/feat/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/vcr/data/vcr_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_vcr_schema` MCP tool
      # via importlib.resources so it works from a real, non-editable install.
      # Same generator as the `docs/*_schema.json` steps above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type vcr --output-dir src/biz/dfch/specmgr/vcr/data || {
          echo "::error::src/biz/dfch/specmgr/vcr/data/vcr_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type vcr --output-dir src/biz/dfch/specmgr/vcr/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `src/biz/dfch/specmgr/sysrs/data/sysrs_schema.json` is correct
      # Packaged copy of the same schema, read by the `get_sysrs_schema` MCP tool
      # via importlib.resources so it works from a real, non-editable install.
      # Same generator as the `docs/*_schema.json` steps above, just a second --output-dir.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema --type sysrs --output-dir src/biz/dfch/specmgr/sysrs/data || {
          echo "::error::src/biz/dfch/specmgr/sysrs/data/sysrs_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type sysrs --output-dir src/biz/dfch/specmgr/sysrs/data' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `docs/coverage.svg` is correct
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr coverage-badge
        git diff --exit-code -- docs/coverage.svg || {
          echo "::error::docs/coverage.svg is out of date -- run 'uv run --frozen --all-extras specmgr coverage-badge' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Lint the in-tree spec artifacts changed in the pull request (feat-218)
      # The feat-218 parseability gate, CI half: full-parse (never the
      # frontmatter+H1 listing stage) every in-tree spec artifact the pull
      # request changed against its base branch -- the feature README.md
      # files under .specmgr/feat/ and the documents under docs/{type}/,
      # selected with the same anchored pattern the specmgr-lint pre-commit
      # hook uses (a drift test pins the identity of the two). A document
      # that fails to parse fails the step: the command's own report names
      # the file, carries the parse error and the per-type repair pointer
      # (REQ-001/REQ-008), so no extra ::error:: echo is needed.
      #
      # pull_request events only: a push to main/dev carries no base ref to
      # diff against, and the commit path is already covered locally by the
      # hook. Pinned to Python 3.13 like the docs drift steps above (same
      # `--python 3.13.13` interpreter pin as their invocations).
      #
      # `--all-extras` is mandatory: the command's registry import chain
      # forces the mcp extra. The base ref and the PR number arrive through
      # the BASE_REF/PR_NUMBER env variables (the step's only expressions,
      # kept out of the script body). The step computes the PR diff the way
      # GitHub itself does -- three-dot semantics: merge base of the base
      # branch tip and the PR head tip, then diff to the head tip -- and
      # never touches HEAD: the PR checkout is shallow (the default
      # actions/checkout is fetch-depth 1) and HEAD is the synthetic PR
      # merge commit sitting at the shallow boundary, whose parents are not
      # in the object store and which the shallow graft gives no traversable
      # ancestry, so `git merge-base HEAD ...` can never find a common
      # ancestor there (the silent exit 1 that failed PR #241). The targeted
      # `git fetch origin <base> --unshallow` converts the shallow checkout
      # to a complete one (git's documented behaviour when the source is
      # complete: the shallow file is dropped and every missing ref's full
      # history is fetched), and the follow-up PLAIN fetch of the PR head
      # (`refs/pull/N/head`, which GitHub exposes for same-repo and fork PRs
      # alike) then arrives with its full history in FETCH_HEAD -- in a
      # complete repo a plain fetch is a full fetch, and for fork PRs this
      # second fetch is what carries the head's commits. A second
      # `--unshallow` would fatal on the now-complete repo, so only the base
      # fetch carries it; the shared checkout's fetch-depth is never
      # changed. The changed files are
      # NUL-delimited end to end (git diff -z, grep -z, xargs -0); when none
      # of them is an in-tree artifact the filtered list is empty and xargs
      # -r runs nothing -- the step skips cleanly.
      if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
        PR_NUMBER: ${{ github.event.number }}
      run: |
        artifact_pattern='^(\.specmgr/feat/[^/]+/README\.md|docs/[^/]+/[^/]+\.md)$'
        # The PR checkout is shallow (fetch-depth 1) and HEAD is the PR merge
        # commit at the shallow boundary: its parents are not in the object
        # store and the shallow graft gives it no traversable ancestry, so
        # `git merge-base HEAD ...` can never find a common ancestor there.
        # The --unshallow base fetch converts the shallow checkout to a
        # complete one (a second --unshallow would fatal on it), so the head
        # fetch is plain -- still a full fetch, now that the repo is
        # complete, and the one that carries the head's commits for fork PRs
        # (refs/pull/N/head works for same-repo and fork PRs alike).
        git fetch origin "$BASE_REF" --unshallow
        git fetch origin "refs/pull/${PR_NUMBER}/head"
        merge_base=$(git merge-base FETCH_HEAD "origin/$BASE_REF")
        # grep exits 1 when the filtered list is empty (the pull request
        # changed no in-tree spec artifact): that is the clean-skip case,
        # not an error -- tolerate exactly 1, let >= 2 (a grep malfunction)
        # fail the step. The runner's default shell is `bash -eo pipefail`,
        # so the unhandled no-match would fail the pipeline on its own.
        git diff --name-only -z --diff-filter=ACMR "$merge_base" FETCH_HEAD \
          | { grep -zE "$artifact_pattern" || [ "$?" -le 1 ]; } \
          | xargs -0 -r uv run --frozen --all-extras --python 3.13.13 specmgr lint --skip-unrecognized

  plantuml-parser:
    env:
      # Opt-in to Node 24 to avoid Node 20 deprecation warnings (effective June 2026).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # feat-214-rel-invalid-diag (REQ-009/ACC-005): the CI real-parser gate. Pinned
    # to a single Python (3.13.13, mirroring the `build` job's docs-drift pin),
    # this job downloads the pinned PlantUML 1.2026.8 release jar (pinned URL +
    # SHA-256, hash-verified in its own step BEFORE any use — a mismatch fails the
    # job), exports SPECMGR_PLANTUML_JAR, and runs the FULL suite with
    # `pytest -n auto -rs` so every env-gated real-parser test (all
    # `require_plantuml_source`-gated tests, incl. the reference-graph subset gate
    # and the golden parser sweep) executes and its skip/pass state is visible in
    # the report: the `-rs` short summary must carry NO `require_plantuml_source`
    # skip reason (the only legitimate skips are the live URL-matrix tests, which
    # apply only to a selected URL source). An emission layout is NOT frozen on a
    # skipped gate (rulebook §4.3, the 2026-10-15 convention). The jar is ~28.5 MB
    # of GPL binary — deliberately NOT committed (clone bloat, license artifact,
    # frozen version); a version upgrade is a one-line URL + hash change with an
    # explicit re-verification (the plan's "Jar pin" design note).
    steps:
    - name: Checkout
      # uses: actions/checkout@v5
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Install uv
      # uses: astral-sh/setup-uv@v5 v5.2.1
      uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca
      with:
        enable-cache: true
        python-version: "3.13.13"

    - name: Install dependencies
      # --all-extras, mirroring `build`: typer/mcp (the CLI + MCP tools under
      # test) and fastembed (the similarity extra) must be present. Sync FIRST
      # (the `build` job's order): a `uv run` before the sync would implicitly
      # build the base (no-extras) environment, which the sync then re-syncs.
      run: uv sync --frozen --python 3.13.13 --all-extras

    - name: Verify tools
      # `java` is preinstalled on the GitHub-hosted ubuntu runners (the plantuml
      # jar needs a JVM); printing the version fails the job early if it is not.
      run: |
        uv --version
        uv run --frozen python --version
        java -version

    - name: Download the pinned PlantUML 1.2026.8 release jar
      # The GitHub release artifact is immutable per tag (the plan's "Jar pin"
      # design note). $RUNNER_TEMP keeps the ~28.5 MB binary out of the checkout.
      run: |
        curl -fSL --retry 3 -o "$RUNNER_TEMP/plantuml.jar" \
          https://github.com/plantuml/plantuml/releases/download/v1.2026.8/plantuml-1.2026.8.jar

    - name: Verify the jar's SHA-256 (fail on mismatch)
      # Hash verification BEFORE any use: the "<hash>  <file>" line form is what
      # `sha256sum --check` expects; --strict additionally rejects malformed
      # checksum lines. Any mismatch exits non-zero and fails the job (bash -e) —
      # a tampered/substituted jar must fail here, not inside the suite.
      run: |
        echo "5e1ecfa8ecd32c90b03bbf3b1eb6f020943f98ab0fcf4032be31a0002ee2c462  $RUNNER_TEMP/plantuml.jar" | sha256sum --check --strict

    - name: Run the full suite with the real parser configured
      # SPECMGR_PLANTUML_JAR makes tests/conftest.py's plantuml_source() gate
      # select the jar (JAR → BIN → URL first-set-wins), so every
      # require_plantuml_source-gated test RUNS; -rs reports every skip reason
      # (ACC-005: none of them may be a require_plantuml_source skip).
      env:
        SPECMGR_PLANTUML_JAR: ${{ runner.temp }}/plantuml.jar
      run: |
        uv run --frozen pytest -n auto -rs
