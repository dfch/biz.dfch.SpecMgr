          echo "::error::src/biz/dfch/specmgr/qa/data/qa_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema --type qa --output-dir src/biz/dfch/specmgr/qa/data' and commit the result (see AGENTS.md)."
