name: Lint and Test

on: [push, pull_request]

jobs:
  build:
    env:
      # Opt-in to Node 24 to avoid Node 20 deprecation warnings (effective June 2026).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - name: Checkout
      # uses: actions/checkout@v5
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Install uv
      # uses: astral-sh/setup-uv@v5 v5.2.1
      uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Verify tools 1
      run: |
        uv --version

    - name: Install dependencies
      run: uv sync --frozen --python "${{ matrix.python-version }}" --all-extras

    - name: Verify tools 2
      run: |
        uv run --frozen python --version
        uv run --frozen ruff --version
        uv run --frozen pylint --version
        uv run --frozen vulture --version

    - name: Analyzing the code with pylint and ruff
      run: |
        uv run --frozen ruff format --check
        uv run --frozen ruff check
        uv run --frozen pylint $(git ls-files '*.py') || true

    - name: Check for dead code with vulture
      run: |
        uv run --frozen vulture src/ whitelist.py --min-confidence 60

    - name: Run unit tests with coverage
      run: |
        uv run --frozen coverage run -m unittest discover -v -s tests -t . -p "test_*.py"

    - name: Make sure `docs/` is correct
      # Python's inspect module (used by annotated-doc for API docs generation) formats
      # exception method signatures differently across Python versions (e.g., 3.12 vs 3.13).
      # This causes docs/ to differ when regenerated on different Python versions. To avoid
      # CI failures due to Python version differences rather than actual code changes, we
      # pin this check to Python 3.13.13 (the project's default dev version in .python-version).
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr docs
        git diff --exit-code -- docs/ || {
          echo "::error::docs/ is out of date -- run 'uv run --frozen --all-extras specmgr docs' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `docs/adr/README.md` is correct
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr adr-toc
        git diff --exit-code -- docs/adr/README.md || {
          echo "::error::docs/adr/README.md is out of date -- run 'uv run --frozen --all-extras specmgr adr-toc' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `docs/req_schema.json` is correct
      # `specmgr schema` itself exits 1 when the regenerated content differs from what
      # was already on disk (or the file didn't exist yet), so no separate
      # `git diff --exit-code` step is needed here, unlike the `docs/`/`docs/adr/README.md`
      # checks above.
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr schema || {
          echo "::error::docs/req_schema.json is out of date -- run 'uv run --frozen --all-extras specmgr schema' and commit the result (see AGENTS.md)."
          exit 1
        }

    - name: Make sure `docs/coverage.svg` is correct
      if: matrix.python-version == '3.13'
      run: |
        uv run --frozen --all-extras --python 3.13.13 specmgr coverage-badge
        git diff --exit-code -- docs/coverage.svg || {
          echo "::error::docs/coverage.svg is out of date -- run 'uv run --frozen --all-extras specmgr coverage-badge' and commit the result (see AGENTS.md)."
          exit 1
        }
