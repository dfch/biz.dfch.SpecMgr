<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:311px;background:#FFFFFF;" width="790px" height="311px" viewBox="0 0 790 311" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="270.75" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="552.487">http://www.plantuml.com/plantuml/png/2b482c2ac94cce2c48cc2b5150724b...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="573.125">http://www.plantuml.com/plantuml/png/~12b482c2ac94cce2c48cc2b5150724b...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="545.282">2b482c2ac94cce2c48cc2b5150724bcccd2f2d5670ca4f5252484c2c06b3b800</text></g><?plantuml-src ZL9DRzim3BthL_0757QYsMsMqpgimGQamp0qXnrfYhMDwCEGv7cvzBUFjfSLksox2998llV8HyijUwEUEeR1ZctluH96mCWmfjwta9XTWXn0qZXYPWC83HeuVJqMKjQd-GOcS08VCjWGpc3xCyE7XyFn_ka136OirASrbDQOSCGhdo2iL1zFXyFZ_MTWJy78Hw5MVCVeqoAhm-yiBDEi1uqeyT0n6exmift_5jY53muX0lz0DrY-UQsL7EhGjxnNNSx3lYodQIe6YpwFpXOKN7bzb8DlIzrKEqqQwMr5n9gg7P5kwcszkTDLKnI5ok7_a5ws_yQQXpJrri8KuXdotFk45_LDr3ky00MVaR846BxCsAV78sH61vZXIlQkTTWl_Ehzc9VEKnT6AyEoAS0GGuED_HFibn4uvYx4z7i1Q8oHVPRarH_qHjP13gbngxpUOSjApSEUWI9JYEP6J97oFhtwiLVgx-qJaT7FsjItTnl2whdMjQvs5MdQt3PlcjrceuJPBilw4m00?></g></svg>