<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" style="width:592px;height:417px;background:#FFFFFF;" width="592px" height="417px" viewBox="0 0 592 417" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="591.469" height="92" fill="#EAE2C9" style="stroke:#EAE2C9;stroke-width:1;"/><text x="10" y="26.401" fill="#000" font-size="14" textLength="313.004" font-weight="700">Add your own dedication into PlantUML</text><text x="10" y="42.698" fill="#000" font-size="14"> </text><text x="10" y="58.995" fill="#000" font-size="14" textLength="157.842">For just $5 per month!</text><text x="10" y="75.292" fill="#000" font-size="14" textLength="70.424">Details on</text><a target="" href="https://plantuml.com/dedication" xlink:href="https://plantuml.com/dedication" xlink:type="simple" xlink:actuate="onRequest" xlink:show="new" title="https://plantuml.com/dedication" xlink:title="https://plantuml.com/dedication"><text x="84.874" y="75.292" fill="#000" font-size="14" textLength="224.738" font-style="italic">https://plantuml.com/dedication</text></a><image width="93" height="93" x="333.004" y="0" xlink:href="data:image/png;base64,"/><rect x="0" y="92" width="591.469" height="205.563" fill="#FFF" style="stroke:#FFF;stroke-width:1;"/><text x="5" y="108.139" fill="#000" font-size="12" textLength="153.914" font-weight="700">Welcome to PlantUML!</text><text x="5" y="122.107" fill="#000" font-size="12"> </text><text x="5" y="136.076" fill="#000" font-size="12" textLength="277.107">You can start with a simple UML Diagram like:</text><text x="5" y="150.045" fill="#000" font-size="12"> </text><text x="5" y="164.014" fill="#000" font-size="12" textLength="122.818" font-family="monospace">Bob->Alice: Hello</text><text x="5" y="177.982" fill="#000" font-size="12"> </text><text x="5" y="191.951" fill="#000" font-size="1